version: '3.8'

services:
  morpho:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morpho-budget-tracker
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - morpho-network

networks:
  morpho-network:
    driver: bridge
